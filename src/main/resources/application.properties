spring.application.name=empleados

#####################################
############  DATABASE  #############
#####################################
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aracingempleados}
spring.datasource.username=${BD_USER}
spring.datasource.password=${BD_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}

#####################################
############  SECURITY  #############
#####################################
security.jwt.secret-key=${JWT_SECURITY_KEY}
security.jwt.expiration-time=3600000

#####################################
#############  CORS  ################
#####################################
app.cors.allowed-origins=http://localhost:3000